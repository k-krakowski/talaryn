     fill="url(#brand)"
     stroke="#061941"
     stroke-width="1.6"
     stroke-linejoin="round"
     id="g3"
     style="fill:#091f55;fill-opacity:1;stroke:none;stroke-opacity:0.500312"
     transform="translate(-27.73326,1.7892426)">
    <path
       d="m 40,55 h 290 l -14,12 q -10,8 -25,11 l -117,23 -9,137 -52,32 V 117 l 23,-13 H 54 Z"
       id="path2"
       style="fill:#091f55;fill-opacity:1;stroke:none;stroke-opacity:0.500312" />
