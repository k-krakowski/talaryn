  <title
     id="title">Talaryn</title>
  <desc
     id="desc">
    The name Talaryn, beginning with a winged letter T inspired by the sandals
    of Hermes.
  </desc>
  <!--
    The reference mark has two simple pieces: the long upper arm and stem of
    the T, plus one folded wing beneath it.  The wing is a single silhouette;
    its inward notch creates two feathers without making them look pasted on.
  -->
